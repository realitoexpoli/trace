eight:700;letter-spacing:.04em;line-height:1.5}.menu .protag,.btn .protag{margin-left:7px}.is-pro .protag{display:none}.tab.locked::after{content:"PRO";margin-left:6px;padding:0 4px;border-radius:3px;background:#e8b923;color:#1c221f;font-size:9px;font-weight:700}.pbadge{display:inline-flex;align-items:center;gap:6px;position:fixed;left:14px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:3;color:#cfd4d0;background:rgba(255,255,255,.08);border-radius:3px;padding:4px 9px;font-size:12px;text-decoration:none}.pbadge b{color:#fff}.pbadge[hidden]{display:none}.voice{display:inline-flex;align-items:center;gap:4px}.voice .rec{color:#a8352b}.voice .rec.on{background:#a8352b;color:#fff;border-color:#a8352b}.voice .vdur{font-variant-numeric:tabular-nums;color:var(--mute);font-size:12px}.voice .vdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:currentColor;margin-right:5px;vertical-align:0}.chip .vmark{margin-left:4px;font-size:11px}

function exampleShowcase(){

function buildShowcaseDeck(){const d={v:1,bg:'#000000',slides:exampleShowcase()};const save=deck;deck=d;syncAll();
  for(const s2 of d.slides)for(const o of s2.objects)if(o.paths){const k=Math.min(...Object.keys(o.paths).map(Number)),tg=s2.objects.find(t=>t.id===o.paths[k].target);if(tg){const P=pathPts(objAt(tg,k));if(P.length){o.x=+P[0][0].toFixed(3);o.y=+P[0][1].toFixed(3);}}}
  syncAll();deck=save;return d;}
function buildJammingDeck(){const d={v:1,bg:'#000000',slides:exampleJamming()};const save=deck;deck=d;syncAll();deck=save;return d;}
function buildSignalDeck(){const d={v:1,bg:'#000000',slides:exampleSignal()};const save=deck;deck=d;syncAll();
  for(const s2 of d.slides){for(const o of s2.objects){if(o.type==='axes'&&o.source&&!(o.ymax>o.ymin))fitGraph(o);}

def _place(g, p):
    g.scale(p["scale"], about_point=ORIGIN).rotate(p["rot"] * DEGREES, about_point=ORIGIN)
    g.shift([p["x"], p["y"], 0])
    if p.get("opacity", 1) < 1:
        _fade(g, p["opacity"])
    return g

def morph_pose(mob, target, start, end, **kw):
    """Move, scale, turn and recolour an object the way the editor does: a real rotation, not a point-by-point blend."""
    base = target.copy().rotate(-end["rot"] * DEGREES).scale(1 / end["scale"])
    def update(m, a):
        s = start["scale"] + (end["scale"] - start["scale"]) * a
        r = start["rot"] + (end["rot"] - start["rot"]) * a
        x, y = start["x"] + (end["x"] - start["x"]) * a, start["y"] + (end["y"] - start["y"]) * a
        arc = end.get("arc", 0)
        if abs(arc) > 0.5 and (start["x"], start["y"]) != (end["x"], end["y"]):
            w = np.exp(1j * arc * DEGREES)
            P0, P1 = complex(start["x"], start["y"]), complex(end["x"], end["y"])
            c = (P1 - P0 * w) / (1 - w)
            Pt = c + (P0 - c) * np.exp(1j * arc * DEGREES * a)
            x, y = Pt.real, Pt.imag
        f = base.copy().scale(s).rotate(r * DEGREES).move_to([x, y, 0])
        if start["color"] != end["color"]:
            f.set_color(interpolate_color(ManimColor(start["color"]), ManimColor(end["color"]), a))
        m.become(f)
    return UpdateFromAlphaFunc(mob, update, **kw)

def morph_params(mob, build, start, end, **kw):
    def update(m, a):
        p = dict(end)
        for k, e in end.items():
            s = start.get(k)
            if isinstance(e, bool) or isinstance(s, bool):
                continue
            if isinstance(e, (int, float)) and isinstance(s, (int, float)):
                p[k] = s + (e - s) * a
            elif isinstance(e, list) and isinstance(s, list) and len(s) == len(e) and all(isinstance(v, (int, float)) for v in s + e):
                p[k] = [u + (w - u) * a for u, w in zip(s, e)]
            elif isinstance(e, list) and isinstance(s, list) and len(s) == len(e) and all(isinstance(v, list) and len(v) == 2 and all(isinstance(c, (int, float)) and not isinstance(c, bool) for c in v) for v in s + e):
                p[k] = [[u[0] + (w[0] - u[0]) * a, u[1] + (w[1] - u[1]) * a] for u, w in zip(s, e)]
            elif callable(e) and callable(s):
                p[k] = _blend(s, e, a)
        arc = end.get("arc", 0)
        if abs(arc) > 0.5 and (start["x"], start["y"]) != (end["x"], end["y"]):
            w = np.exp(1j * arc * DEGREES)
            P0, P1 = complex(start["x"], start["y"]), complex(end["x"], end["y"])
            c = (P1 - P0 * w) / (1 - w)
            Pt = c + (P0 - c) * np.exp(1j * arc * DEGREES * a)
            p["x"], p["y"] = Pt.real, Pt.imag
        m.become(build(p))
    return UpdateFromAlphaFunc(mob, update, **kw)

DIRS = {"ur": UR, "ul": UL, "dr": DR, "dl": DL, "up": UP, "down": DOWN, "left": LEFT, "right": RIGHT}

def make_point(p):
    dot = Dot(radius=0.08 * p["size"], color=p["color"])
    g = VGroup(dot)
    if p["label"]:
        g.add(MathTex(p["label"], font_size=p["font_size"], color=p["color"]).next_to(dot, DIRS[p["dir"]], buff=0.12))
    return _place(g, p)

def _interior(v, a, b):
    a1, a2 = np.arctan2(a[1] - v[1], a[0] - v[0]), np.arctan2(b[1] - v[1], b[0] - v[0])
    w = (a2 - a1 + np.pi) % (2 * np.pi) - np.pi
    return a1, w

def make_triangle(p):
    V = [np.array([p["ax"], p["ay"], 0.0]), np.array([p["bx"], p["by"], 0.0]), np.array([p["cx"], p["cy"], 0.0])]
    G = sum(V) / 3
    g = VGroup(Polygon(*V, color=p["color"], fill_opacity=p["fill"], stroke_width=p["stroke"]))
    out = lambda P, d: P + (P - G) / (np.linalg.norm(P - G) or 1) * d
    for i in range(3):
        if p["angles"]:
            a0, w = _interior(V[i], V[(i + 1) % 3], V[(i + 2) % 3])
            g.add(Arc(radius=0.38, start_angle=a0, angle=w, arc_center=V[i], color=p["color"], stroke_width=3))
        if i < len(p["vlabels"]) and p["vlabels"][i]:
            g.add(MathTex(p["vlabels"][i], font_size=40, color=p["color"]).move_to(out(V[i], 0.38)))
        if i < len(p["slabels"]) and p["slabels"][i]:
            M = (V[(i + 1) % 3] + V[(i + 2) % 3]) / 2
            g.add(MathTex(p["slabels"][i], font_size=36, color=p["color"]).move_to(out(M, 0.32)))
    return _place(g, p)

    u1, u2 = np.array([np.cos(a1), np.sin(a1), 0]), np.array([np.cos(a1 + w), np.sin(a1 + w), 0])

def make_plane(p):
    plane = NumberPlane(x_range=[p["xmin"], p["xmax"], 1], y_range=[p["ymin"], p["ymax"], 1], x_length=p["w"], y_length=p["h"],

    for i in range(1, len(rows)):
        if row_op(i) > 0 or row_op(i - 1) > 0:
            g.add(Line([-W / 2, top - i * rh, 0], [W / 2, top - i * rh, 0], color=p["color"], stroke_width=4 if (p["header"] and i == 1) else 2, stroke_opacity=1 if (p["header"] and i == 1) else 0.7))
    for j in range(1, nc):
        g.add(Line([xs[j], -top, 0], [xs[j], top, 0], color=p["color"], stroke_width=2, stroke_opacity=0.7))
    for i, r in enumerate(rows):
        if row_op(i) <= 0:
            continue
        for j in range(nc):
            txt = str(r[j]) if j < len(r) else ""
            if txt:
                t = Text(txt, font=p.get("font", "Arial"), font_size=fs * 0.75, color=p["color"], weight=BOLD if ((p["header"] and i == 0) or p.get("bold")) else NORMAL, slant=ITALIC if p.get("italic") else NORMAL)
                t.move_to([(xs[j] + xs[j + 1]) / 2, top - (i + 0.5) * rh, 0]).set_opacity(row_op(i))
                g.add(t)
    return _place(g, p)

def make_star(p):
    g = VGroup(Star(n=max(3, int(round(p["n"]))), outer_radius=p["r"], inner_radius=p["r"] * p["inner"], start_angle=PI / 2, color=p["color"], fill_opacity=p["fill"], stroke_width=p["stroke"]))
    return _place(g, p)

def make_sector(p):
    a1, w = p["a1"] * DEGREES, (p["a2"] - p["a1"]) * DEGREES
    g = VGroup(AnnularSector(inner_radius=max(0, p["inner"]), outer_radius=p["r"], angle=w, start_angle=a1, color=p["color"], fill_opacity=p["fill"], stroke_width=p["stroke"], stroke_color=p["color"]))
    return _place(g, p)

def make_cross(p):
    q = p["size"] / 2
    sw = 8 * p["size"] ** 0.3
    g = VGroup(Line([-q, -q, 0], [q, q, 0], color=p["color"], stroke_width=sw), Line([-q, q, 0], [q, -q, 0], color=p["color"], stroke_width=sw))
    return _place(g, p)

VENN_COLS = ["#58C4DD", "#FC6255", "#83C167"]

def make_venn(p):
    r, s, n = p["r"], p["sep"], int(p["sets"])
    C = [(-s / 2, 0), (s / 2, 0)] if n == 2 else [(-s / 2, s * 0.29), (s / 2, s * 0.29), (0, -s * 0.58)]
    circles = [Circle(radius=r, color=VENN_COLS[i], stroke_width=p["stroke"]).move_to([c[0], c[1], 0]) for i, c in enumerate(C)]
    g = VGroup()
    ops = {"union": Union, "intersection": Intersection, "difference": Difference, "exclusion": Exclusion}
    if p["op"] in ops:
        g.add(ops[p["op"]](circles[0], circles[1], color=p["fill_color"], fill_opacity=p["fill"], stroke_width=0))
    g.add(*circles)
    for i, t in enumerate(p["labels"][:n]):
        if t:
            c = np.array([C[i][0], C[i][1], 0.0])
            d = c / (np.linalg.norm(c) or 1)
            g.add(MathTex(t, font_size=40, color=VENN_COLS[i]).move_to(c + d * (r + 0.32)))
    return _place(g, p)

def make_bullets(p):
    items, fs = p["items"], p["font_size"]
    em = fs / 48 * 0.62
    lh = em * p["spacing"]
    W = max([1] + p["widths"]) * em * 0.5 + em * 0.9
    top, x0 = lh * len(items) / 2, -W / 2
    shown = min(len(items), p["shown"]) if p["shown"] > 0 else len(items)
    ro = lambda i: 1 if i < int(shown) else (shown - int(shown) if i == int(shown) else 0)
    g = VGroup()
    for i, it in enumerate(items):
        a = ro(i)
        if a <= 0:
            continue
        y = top - (i + 0.5) * lh
        if int(round(p["hl"])) == i + 1:
            g.add(RoundedRectangle(corner_radius=0.06, width=W + 0.3, height=lh, fill_color=p["hl_color"], fill_opacity=0.22 * a, stroke_width=0).move_to([0, y, 0]))
        g.add(Dot([x0 + em * 0.22, y, 0], radius=em * 0.11, color=p["color"]).set_opacity(a))
        t = MarkupText(it, font=p.get("font", "Arial"), font_size=fs * 0.75, color=p["color"], weight=BOLD if p.get("bold") else NORMAL, slant=ITALIC if p.get("italic") else NORMAL)
        t.move_to([0, y, 0]).align_to([x0 + em * 0.75, 0, 0], LEFT).set_opacity(a)
        g.add(t)
    return _place(g, p)

def make_code(p):
    lines, fs = p["lines"], p["font_size"]
    em = fs / 48 * 0.62
    probe = Text("M" * 20, font="Monospace", font_size=fs * 0.75)
    cw = probe.width / 20
    lh, pad = em * 1.45, 0.25
    nw = (len(str(len(lines))) * cw + cw * 1.2) if p["numbers"] else 0
    W, H = p["maxc"] * cw + nw + 2 * pad, len(lines) * lh + 2 * pad
    top, x0 = H / 2, -W / 2
    shown = min(len(lines), p["shown"]) if p["shown"] > 0 else len(lines)
    ro = lambda i: 1 if i < int(shown) else (shown - int(shown) if i == int(shown) else 0)
    g = VGroup(RoundedRectangle(corner_radius=0.12, width=W, height=H, fill_color="#272822", fill_opacity=1, stroke_width=0))
    esc = lambda t: t.replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;")
    for i, toks in enumerate(lines):
        a = ro(i)
        if a <= 0:
            continue
        y = top - pad - (i + 0.5) * lh
        if int(round(p["hl"])) == i + 1:
            g.add(Rectangle(width=W, height=lh, fill_color="#F4D345", fill_opacity=0.16 * a, stroke_width=0).move_to([0, y, 0]))
        if p["numbers"]:
            n = Text(str(i + 1), font="Monospace", font_size=fs * 0.75, color="#75715E")
            g.add(n.move_to([0, y, 0]).align_to([x0 + pad + nw - cw * 1.2, 0, 0], RIGHT).set_opacity(a))
        text = "".join(t for t, _ in toks)
        indent = len(text) - len(text.lstrip(" "))
        body = "".join(f'<span foreground="{c}">{esc(t)}</span>' for t, c in toks).lstrip() if text.strip() else ""
        if body.strip():
            first = toks[0][0]
            if first.strip() == "":
                toks2 = toks[1:]
            else:
                toks2 = [(first.lstrip(" "), toks[0][1])] + toks[1:]
            body = "".join(f'<span foreground="{c}">{esc(t)}</span>' for t, c in toks2 if t)
            t = MarkupText(body, font="Monospace", font_size=fs * 0.75)
            t.move_to([0, y, 0]).align_to([x0 + pad + nw + indent * cw, 0, 0], LEFT).set_opacity(a)
            g.add(t)
    return _place(g, p)

def make_polar(p):
    R, rmax = p["R"], p["rmax"]
    plane = PolarPlane(radius_max=rmax, size=2 * R, radius_step=p["step"], azimuth_step=12,
                       background_line_style={"stroke_color": p["color"], "stroke_width": 2, "stroke_opacity": 0.55})
    g = VGroup(plane) if p["grid"] else VGroup()
    t1 = p["tmin"] + (p["tmax"] - p["tmin"]) * min(1, max(0.002, p["progress"]))
    def safe(t):
        with np.errstate(all="ignore"):
            r = float(p["rfn"](t))
        return r if np.isfinite(r) and abs(r) <= rmax * 1.5 else 0.0
    g.add(plane.plot_polar_graph(safe, [p["tmin"], t1], color=p["fn_color"], stroke_width=4))
    if p["head"]:
        g.add(Dot(plane.pr2pt(safe(t1), t1), color=p["fn_color"]))
    return _place(g, p)

def make_cplane(p):
    s = p["w"] / (p["xmax"] - p["xmin"])
    plane = ComplexPlane(x_range=[p["xmin"], p["xmax"], 1], y_range=[p["ymin"], p["ymax"], 1], x_length=p["w"], y_length=s * (p["ymax"] - p["ymin"]),
                         background_line_style={"stroke_color": p["color"], "stroke_width": 2, "stroke_opacity": 0.65}, faded_line_ratio=1)
    plane.shift(-plane.n2p(0))
    labels = VGroup()
    if p["coords"]:
        for x in range(int(np.ceil(p["xmin"])), int(np.floor(p["xmax"])) + 1):
            if x:
                labels.add(MathTex(str(x), font_size=22).next_to(plane.n2p(complex(x, 0)), DOWN, buff=0.12))
        for y in range(int(np.ceil(p["ymin"])), int(np.floor(p["ymax"])) + 1):
            if y:
                labels.add(MathTex(("" if y == 1 else "-" if y == -1 else str(y)) + "i", font_size=22).next_to(plane.n2p(complex(0, y)), LEFT, buff=0.12))
    a, f = p["amount"], p["fz"]
    if a > 0:
        def warp(q):
            z = q / s
            with np.errstate(all="ignore"):
                w = (1 - a) * z + a * complex(f(z))
            return w * s if np.isfinite(w) and abs(w * s) < 40 else q
        plane.prepare_for_nonlinear_transform()
        plane.apply_complex_function(warp)
    return _place(VGroup(plane, labels), p)

def make_network(p):
    names, pos, R = p["names"], p["pos"], p["R"]
    P = [np.array([x, y, 0.0]) for x, y in pos]
    g = VGroup()
    for a, b, directed in p["edges"]:
        A, B = P[a], P[b]
        u = (B - A) / (np.linalg.norm(B - A) or 1)
        S, E = A + u * R, B - u * R
        style = dict(color=p["color"], stroke_width=2 if p["nn"] else 3, stroke_opacity=0.6 if p["nn"] else 1)
        g.add(Arrow(S, E, buff=0, tip_length=0.22, **style) if directed else Line(S, E, **style))
    for i, nme in enumerate(names):
        col = p["hl_color"] if p["hl"][i] else p["node_color"]
        g.add(Circle(radius=R, fill_color=col, fill_opacity=0.9, stroke_color=WHITE, stroke_width=2).move_to(P[i]))
        if p["labels"]:
            g.add(MathTex(nme, font_size=max(14, R * 70), color="#111111").move_to(P[i]))
    return _place(g, p)

SIMTXT = {"en": {"dm": "decide −1", "dp": "decide +1", "err": "Error rate", "tx": "Transmitter", "jam": "Jammer", "rx": "Receiver", "hops": "Hops received", "spec": "spectrum", "time": "time ↓", "gain": "Processing gain", "errs": "errors", "noise": "noise", "sig": "signal", "freq": "frequency →"},
          "fr": {"dm": "décide −1", "dp": "décide +1", "err": "Taux d'erreur", "tx": "Émetteur", "jam": "Brouilleur", "rx": "Récepteur", "hops": "Sauts reçus", "spec": "spectre", "time": "temps ↓", "gain": "Gain de traitement", "errs": "erreurs", "noise": "bruit", "sig": "signal", "freq": "fréquence →"}}

def _st(p, k):
    return SIMTXT.get(p.get("lang", "en"), SIMTXT["en"])[k]

def _mulberry32(a):
    s = [a & 0xFFFFFFFF]
    def r():
        s[0] = (s[0] + 0x6D2B79F5) & 0xFFFFFFFF
        a = s[0]
        t = ((a ^ (a >> 15)) * (1 | a)) & 0xFFFFFFFF
        t = ((t + (((t ^ (t >> 7)) * (61 | t)) & 0xFFFFFFFF)) & 0xFFFFFFFF) ^ t
        return ((t ^ (t >> 14)) & 0xFFFFFFFF) / 4294967296
    return r

def _gauss(r):
    u, v = 1 - r(), r()
    return math.sqrt(-2 * math.log(u)) * math.cos(2 * math.pi * v)

def _Q(x):
    return 0.5 * math.erfc(x / math.sqrt(2))

def _lin(d):
    return 10 ** (d / 10)

def _fmt_ber(x):
    if x < 1e-6:
        return "< 10⁻⁶"
    m, e = f"{x:.1e}".split("e")
    sup = str.maketrans("0123456789-", "⁰¹²³⁴⁵⁶⁷⁸⁹⁻")
    return f"{m}×10{str(int(e)).translate(sup)}"

def _bpsk_ber(p):
    N0 = 1 / _lin(p["eb"])
    if p["jam"] == "off":
        return _Q(math.sqrt(2 / N0))
    if p["jam"] == "tone":
        a, g = math.sqrt(_lin(p["js"])), math.sqrt(2 / N0)
        return sum(_Q(g * (1 + a * math.cos(2 * math.pi * (k + 0.5) / 72))) for k in range(72)) / 72
    return _Q(math.sqrt(2 / (N0 + _lin(p["js"]))))

def _label(t, x, y, size, color, align="center"):
    m = Text(t, font="Arial", font_size=size * 0.75, color=color)
    m.move_to([x, y, 0])
    if align == "left":
        m.align_to([x, 0, 0], LEFT)
    elif align == "right":
        m.align_to([x, 0, 0], RIGHT)
    return m

def make_constellation(p):
    w, h = p["w"], p["h"]
    N0 = 1 / _lin(p["eb"])
    J = 0 if p["jam"] == "off" else _lin(p["js"])
    s0, jn, ja = math.sqrt(N0 / 2), math.sqrt(J / 2), math.sqrt(J)
    R = 1.3 + 3.2 * math.sqrt(N0 / 2 + (J / 2 if p["jam"] == "noise" else 0)) + (ja if p["jam"] == "tone" else 0)
    R = min(7, max(2.2, R))
    sc = min(w, h) / 2 / R * 0.92
    g = VGroup(Rectangle(width=w, height=h, color=p["color"], stroke_width=2, stroke_opacity=0.5))
    for k in range(-int(R), int(R) + 1):
        if abs(k * sc) < w / 2:
            g.add(Line([k * sc, -h / 2, 0], [k * sc, h / 2, 0], color=p["color"], stroke_width=1, stroke_opacity=0.18))
        if abs(k * sc) < h / 2:
            g.add(Line([-w / 2, k * sc, 0], [w / 2, k * sc, 0], color=p["color"], stroke_width=1, stroke_opacity=0.18))
    g.add(DashedLine([0, -h / 2, 0], [0, h / 2, 0], color="#F4D345", stroke_width=3, dash_length=0.12))
    rng = _mulberry32(int(p["seed"]))
    ph = p["phase"] * DEGREES
    dots = {"b": [], "t": [], "e": []}
    for i in range(int(p["n"])):
        b = -1 if rng() < 0.5 else 1
        nx, ny, qx, qy = _gauss(rng), _gauss(rng), _gauss(rng), _gauss(rng)
        x, y = b + s0 * nx, s0 * ny
        if p["jam"] == "noise":
            x, y = x + jn * qx, y + jn * qy
        elif p["jam"] == "tone":
            a = ph + 2 * math.pi * 0.1371 * i
            x, y = x + ja * math.cos(a), y + ja * math.sin(a)
        if abs(x * sc) > w / 2 or abs(y * sc) > h / 2:
            continue
        e = (1 if x >= 0 else -1) != b
        dots["e" if e else ("b" if b > 0 else "t")].append([x * sc, y * sc, 0])
    for k, col, r, op in (("b", "#58C4DD", 0.035, 0.75), ("t", "#5CD0B3", 0.035, 0.75), ("e", "#FC6255", 0.05, 1)):
        g.add(*[Dot(q, radius=r, color=col, fill_opacity=op) for q in dots[k]])
    if p["jam"] == "tone":
        for sg in (-1, 1):
            g.add(DashedVMobject(Circle(radius=ja * sc, color="#9A72AC", stroke_width=2).move_to([sg * sc, 0, 0]), num_dashes=40))
    for sg in (-1, 1):
        g.add(Dot([sg * sc, 0, 0], radius=0.09, color="#F4D345"), _label("−1" if sg < 0 else "+1", sg * sc, -0.32, 24, WHITE))
    g.add(_label(_st(p, "dm"), -0.15, h / 2 - 0.25, 20, p["color"], "right"), _label(_st(p, "dp"), 0.15, h / 2 - 0.25, 20, p["color"], "left"))
    if p["show_ber"]:
        g.add(_label(f"{_st(p, 'err')} ≈ {_fmt_ber(_bpsk_ber(p))}", 0, -h / 2 - 0.35, 26, "#F4D345"))
    return _place(g, p)

def make_jsmap(p):
    w, h = p["w"], p["h"]
    s1 = w / 10
    T, R, Jm = (p["tx"], p["ty"]), (p["rx"], p["ry"]), (p["jx"], p["jy"])
    js = lambda P: p["dP"] + 10 * p["n"] * math.log10(math.hypot(P[0] - T[0], P[1] - T[1]) / max(1e-6, math.hypot(P[0] - Jm[0], P[1] - Jm[1])))
    nx = 48
    ny = round(48 * h / w)
    cw, ch = w / nx, h / ny
    g = VGroup()
    for i in range(nx):
        for j in range(ny):
            P = ((-w / 2 + (i + 0.5) * cw) / s1, (h / 2 - (j + 0.5) * ch) / s1)
            v = js(P)
            bad = v > p["M"]
            lv = min(4, int(min(1, abs(v - p["M"]) / 20) * 4.999))
            g.add(Rectangle(width=cw + 0.004, height=ch + 0.004, stroke_width=0, fill_color="#FC6255" if bad else "#58C4DD",
                            fill_opacity=0.18 + 0.12 * lv).move_to([-w / 2 + (i + 0.5) * cw, h / 2 - (j + 0.5) * ch, 0]))
    k = 10 ** ((p["M"] - p["dP"]) / (10 * p["n"]))
    if abs(1 - k * k) > 1e-6:
        cx, cy = (T[0] - k * k * Jm[0]) / (1 - k * k), (T[1] - k * k * Jm[1]) / (1 - k * k)
        r = k * math.hypot(T[0] - Jm[0], T[1] - Jm[1]) / abs(1 - k * k)
        seg = []
        for i in range(241):
            a = 2 * math.pi * i / 240
            px, py = (cx + r * math.cos(a)) * s1, (cy + r * math.sin(a)) * s1
            if abs(px) > w / 2 or abs(py) > h / 2:
                if len(seg) > 1:
                    g.add(VMobject(color="#F4D345", stroke_width=4).set_points_as_corners(seg))
                seg = []
                continue
            seg.append([px, py, 0])
        if len(seg) > 1:
            g.add(VMobject(color="#F4D345", stroke_width=4).set_points_as_corners(seg))
    g.add(Rectangle(width=w, height=h, color=p["color"], stroke_width=2))
    for P, col, lab in ((T, "#58C4DD", _st(p, "tx")), (Jm, "#FC6255", _st(p, "jam")), (R, "#83C167", _st(p, "rx"))):
        g.add(Dot([P[0] * s1, P[1] * s1, 0], radius=0.11, color=col), _label(lab, P[0] * s1, P[1] * s1 + 0.3, 24, col))
    vr = js(R)
    g.add(_label(f"J/S = {'+' if vr > 0 else ''}{vr:.1f} dB", R[0] * s1, R[1] * s1 - 0.32, 22, "#FC6255" if vr > p["M"] else "#83C167"))
    return _place(g, p)

def _hop_model(p, hh):
    C, J, N = 16, _lin(p["js"]), _lin(-15)
    sig = 5 if p["mode"] == "fixed" else int(_mulberry32(int(p["seed"]) * 100003 + ((hh % 1000000) + 1000000))() * C)
    jc = [0.0] * C
    frac = 1
    if p["jam"] == "spot":
        jc[5] = J
    elif p["jam"] == "barrage":
        jc = [J / C] * C
    elif p["jam"] == "sweep":
        a = (hh * 2) % C
        jc[a] = J / 2
        jc[(a + 1) % C] = J / 2
    elif p["jam"] == "follower":
        frac = max(0, 1 - p["react"] / 100)
        if frac > 0:
            jc[sig] = J
    j_eff = jc[sig]
    if p["jam"] == "follower" and frac < 0.25:
        j_eff = 0
    return sig, jc, 10 * math.log10(1 / (N + j_eff)) >= 6

def make_hopping(p):
    C, Rn, w, h = 16, max(4, int(p["rows"])), p["w"], p["h"]
    sp, gap = h * 0.26, 0.18
    cw = w / C
    top = h / 2
    wfT = top - sp - gap
    rh = (h - sp - gap) / Rn
    H = math.floor(p["hop"])
    fr = p["hop"] - H
    yS = lambda v: top - sp + (max(-20, min(35, v)) + 20) / 55 * sp
    g = VGroup()
    for c in range(C + 1):
        g.add(Line([-w / 2 + c * cw, wfT, 0], [-w / 2 + c * cw, -h / 2, 0], color=p["color"], stroke_width=1, stroke_opacity=0.2))
    clip = lambda y: max(-h / 2, min(wfT, y))
    for r in range(-1, Rn):
        hh = H - r
        y0, y1 = wfT - (r + fr) * rh, wfT - (r + fr + 1) * rh
        a, b = clip(y0), clip(y1)
        if a - b <= 0.001:
            continue
        sig, jc, ok = _hop_model(p, hh)
        for c, jv in enumerate(jc):
            if jv > 0:
                lv = min(4, max(0, int((10 * math.log10(jv) + 20) / 55 * 5)))
                g.add(Rectangle(width=cw, height=a - b, stroke_width=0, fill_color="#FC6255", fill_opacity=0.25 + 0.12 * lv).move_to([-w / 2 + (c + 0.5) * cw, (a + b) / 2, 0]))
        x0, ww = -w / 2 + sig * cw + cw * 0.15, cw * 0.7
        g.add(Rectangle(width=ww, height=max(0.001, a - b - 0.04), stroke_width=0, fill_color="#5CD0B3", fill_opacity=0.9).move_to([x0 + ww / 2, (a + b) / 2, 0]))
        if not ok and a - b > rh * 0.5:
            g.add(Line([x0, a - 0.04, 0], [x0 + ww, b + 0.04, 0], color=WHITE, stroke_width=3), Line([x0 + ww, a - 0.04, 0], [x0, b + 0.04, 0], color=WHITE, stroke_width=3))
    g.add(Rectangle(width=w, height=wfT + h / 2, color=p["color"], stroke_width=2).move_to([0, (wfT - h / 2) / 2, 0]))
    sig, jc, ok = _hop_model(p, H)
    g.add(Line([-w / 2, yS(-20), 0], [w / 2, yS(-20), 0], color=p["color"], stroke_width=2))
    for c, jv in enumerate(jc):
        if jv > 0:
            y = yS(10 * math.log10(jv) + 15)
            g.add(Rectangle(width=cw * 0.8, height=max(0.001, y - yS(-20)), stroke_width=0, fill_color="#FC6255", fill_opacity=0.8).move_to([-w / 2 + (c + 0.5) * cw, (y + yS(-20)) / 2, 0]))
    y = yS(15)
    g.add(Rectangle(width=cw * 0.5, height=y - yS(-20), stroke_width=0, fill_color="#5CD0B3", fill_opacity=1).move_to([-w / 2 + (sig + 0.5) * cw, (y + yS(-20)) / 2, 0]))
    g.add(DashedLine([-w / 2, yS(9), 0], [w / 2, yS(9), 0], color="#F4D345", stroke_width=3, dash_length=0.1))
    okc = sum(1 for hh in range(H - 63, H + 1) if _hop_model(p, hh)[2])

def implicit_mesh(F, xr, yr, zr, n=18):
    xs, ys, zs = (np.linspace(r[0], r[1], n + 1) for r in (xr, yr, zr))
    X, Y, Z = np.meshgrid(xs, ys, zs, indexing="ij")
    with np.errstate(all="ignore"):
        try:
            V = np.asarray(F(X, Y, Z), dtype=float) * np.ones_like(X)
        except Exception:

    tets = [(0, 1, 2, 6), (0, 2, 3, 6), (0, 3, 7, 6), (0, 7, 4, 6), (0, 4, 5, 6), (0, 5, 1, 6)]
    tris = []
    for i in range(n):

            for k in range(n):
                vals = [V[i + a, j + b, k + c] for a, b, c in corners]
                if not np.all(np.isfinite(vals)) or min(vals) > 0 or max(vals) < 0:
                    continue
                pts = [np.array([xs[i + a], ys[j + b], zs[k + c]]) for a, b, c in corners]
                cut = lambda a, b: pts[a] + (pts[b] - pts[a]) * (vals[a] / (vals[a] - vals[b]))
                for t in tets:
                    ins = [q for q in t if vals[q] < 0]
                    out = [q for q in t if vals[q] >= 0]
                    if not ins or not out:
                        continue
                    if len(ins) == 1:
                        tris.append([cut(ins[0], q) for q in out])
                    elif len(out) == 1:
                        tris.append([cut(out[0], q) for q in ins])
                    else:

                        c, d = out

                        tris += [[p1, p2, p3], [p1, p3, p4]]
    return tris

    {target:()=>$('#f_step'),title:'Draw the graph on a click',body:'The graph is selected. Under <b>Animation</b>, set <b>Appears</b> to <b>On click 1</b>.',wait:()=>stepOf(firstOf('axes')||{})>=1,auto:()=>setInput('#f_step','1'),before:()=>{const a=firstOf('axes');if(a&&sel!==a.id)selectId(a.id);}},

    {target:()=>$('#presentBtn'),title:'Present it',body:'Press <b>Present</b>.',wait:()=>!$('#present').hidden,auto:()=>$('#presentBtn').click()},
    {title:'You are presenting',body:'Click once: the graph draws itself. Drag the <b>k</b> slider at the bottom to change the wave. Press <b>Esc</b> when you are done.',place:'corner',dim:false,wait:()=>{if(!$('#present').hidden)presented=true;return presented&&$('#present').hidden;},auto:()=>closePresent()},

    {title:'Change things on a click',body:'Objects can move, grow, turn or change colour on a click, and Tracé animates the change. We start in a small practice project.',place:'center',next:'Start',action:()=>tourDeck('Practice: change on a click',os=>{os.push(Object.assign(make('text'),{text:'Moving on a click',y:3.2}));const c=Object.assign(make('circle'),{x:-4,y:-0.5,radius:0.8});cid=c.id;os.push(c);})},
    {target:()=>$('#addClick'),title:'Add a click',body:'Press <b>+ Click</b> under the slide.',wait:()=>maxStep(slide())>=1&&editStep>=1,auto:()=>$('#addClick').click(),before:()=>{if(sel){sel=null;renderCanvas();renderProps();}}},

    {target:()=>$('#props [data-ck="color"]'),title:'Change its colour too',body:'Pick another colour. Everything you change while Click 1 is selected happens on that click.',wait:()=>!!C()?.keys?.[1]?.color,auto:()=>{snap();writeOf(C(),'color').color='#FC6255';persist();refresh();},optional:true,before:()=>{if(sel!==cid){sel=cid;renderCanvas();renderProps();}}},
    {target:()=>$('#playStep'),title:'Watch the click',body:'Press <b>▶ Play</b> to play just this click.',wait:()=>tourFlags.play,auto:()=>$('#playStep')?.click(),before:()=>{tourFlags.play=false;}},
    {target:()=>$('#stepbar'),title:'Leaving click editing',body:'Click <b>Click 1</b> again (or <b>Opens</b>) to go back to editing the slide as a whole. Each step shows what happens on it: <b>~1</b> means one object changes.',next:'Next'},

  ];},
  slides:()=>{let rid=null;const R=()=>slide().objects.find(o=>o.id===rid);return[

function tourBuild(){if(tourUI.card)return;
  tourUI.dim=document.createElement('div');tourUI.dim.className='tour-dim';
  tourUI.spot=document.createElement('div');tourUI.spot.className='tour-spot';
  tourUI.card=document.createElement('div');tourUI.card.className='tour-card';tourUI.card.setAttribute('role','dialog');tourUI.card.setAttribute('aria-live','polite');
  document.body.append(tourUI.dim,tourUI.spot,tourUI.card);
  tourUI.card.addEventListener('click',e=>{const b=e.target.closest('[data-tb]');if(!b)return;e.stopPropagation();const k=b.dataset.tb,st=tour&&tour.steps[tour.i];if(!st)return;
    if(k==='end')endTour();else if(k==='back')tourShow(tour.i-1);else if(k==='auto'){setTimeout(()=>{try{st.auto();}catch(_){}},0);}else if(k==='next'){if(st.action)st.action();if(tour.i>=tour.steps.length-1)endTour();else tourShow(tour.i+1);}});}
function startTour(name){if(!TOURS[name])return;endTour();closeMenus();if(!$('#present').hidden)closePresent();tourBuild();tour={name,steps:TOURS[name](),i:0};try{localStorage.setItem('trace-toured','1');}catch(_){}tourShow(0);tourTimer=setInterval(tourTick,150);}
function endTour(){clearInterval(tourTimer);tour=null;for(const k of['dim','spot','card'])if(tourUI[k])tourUI[k].remove();tourUI.dim=tourUI.spot=tourUI.card=null;}
function tourShow(i){if(!tour)return;i=Math.max(0,Math.min(i,tour.steps.length-1));tour.i=i;tour.doneAt=0;const st=tour.steps[i];try{st.before&&st.before();}catch(_){}
  const n=tour.steps.length,btns=[];
  if(i>0&&!st.wait)btns.push('<button class="btn" data-tb="back">Back</button>');
  if(st.auto)btns.push('<button class="btn" data-tb="auto">Do it for me</button>');
  if(!st.wait||st.optional)btns.push(`<button class="btn${st.plain||st.optional?'':' primary'}" data-tb="next">${st.next||(st.optional?'Skip this step':'Next')}</button>`);
  tour.lastScroll=0;
  tourUI.card.innerHTML=`<div class="tour-top"><span>${n>1?`Step ${i+1} of ${n}`:'Tour'}</span><button class="tour-x" data-tb="end" aria-label="End the tour" title="End the tour">×</button></div><h3>${st.title}</h3><p>${st.body}</p>${st.wait?'<p class="tour-wait">Waiting for you… the tour moves on when it is done.</p>':''}<div class="tour-btns">${btns.join('')}</div>`;
  tourTick();}
function tourTick(){if(!tour)return;const st=tour.steps[tour.i],t=st.target&&st.target(),presenting=!$('#present').hidden;
  let r=t&&t.getBoundingClientRect&&t.getBoundingClientRect();const visible=r&&r.width>0&&r.height>0;
  // bring the place to act into view (again if the page moved it away)
  if(visible&&!presenting&&(r.top<8||r.bottom>innerHeight-8)&&performance.now()-(tour.lastScroll||0)>1200){tour.lastScroll=performance.now();t.scrollIntoView({block:'center',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});}
  tourUI.dim.style.display=(st.dim===false||presenting||visible)?'none':'block';
  if(visible&&!presenting){const p=6;Object.assign(tourUI.spot.style,{display:'block',left:(r.left-p)+'px',top:(r.top-p)+'px',width:(r.width+2*p)+'px',height:(r.height+2*p)+'px'});}else tourUI.spot.style.display='none';
  const c=tourUI.card,cw=c.offsetWidth,ch=c.offsetHeight,W=innerWidth,H=innerHeight,m=12;let x,y;
  if(presenting){x=m;y=H-ch-m-60;}
  else if(st.place==='corner'){x=W-cw-m;y=H-ch-m;}
  else if(!visible||st.place==='center'){x=(W-cw)/2;y=Math.max(m,(H-ch)/2);}
  else{const cl=([a,b])=>[Math.max(m,Math.min(a,W-cw-m)),Math.max(m,Math.min(b,H-ch-m))];
    const cand=[[r.right+16,r.top],[r.left-cw-16,r.top],[r.left,r.bottom+16],[r.left,r.top-ch-16]];
    // no side fits as it is: slide each side into the screen, then try the corners, and keep the place that hides least of the target
    const over=([a,b])=>Math.max(0,Math.min(a+cw,r.right+8)-Math.max(a,r.left-8))*Math.max(0,Math.min(b+ch,r.bottom+8)-Math.max(b,r.top-8));
    const fit=cand.find(([a,b])=>a>=m&&a+cw<=W-m&&b+ch<=H-m&&b>=m)||[...cand,[m,m],[W-cw-m,m],[m,H-ch-m],[W-cw-m,H-ch-m],[(W-cw)/2,m],[(W-cw)/2,H-ch-m]].map(cl).reduce((best,q)=>over(q)<over(best)?q:best);
    x=fit[0];y=fit[1];}
  // while the person drags something, keep the card still so it does not jump under the pointer
  if(tourDragging&&c.style.left){}else{c.style.left=Math.max(m,Math.min(x,W-cw-m))+'px';c.style.top=Math.max(m,Math.min(y,H-ch-m))+'px';}
  if(st.wait){let ok=false;try{ok=st.wait();}catch(_){}if(ok){if(!tour.doneAt)tour.doneAt=performance.now();else if(performance.now()-tour.doneAt>450){if(tour.i>=tour.steps.length-1)endTour();else tourShow(tour.i+1);}}}}
addEventListener('pointerdown',e=>{if(tour&&!e.target.closest('.tour-card'))tourDragging=true;},true);
addEventListener('pointerup',()=>{if(tourDragging){tourDragging=false;tour&&tourTick();}},true);
addEventListener('pointercancel',()=>{tourDragging=false;},true);
addEventListener('resize',()=>tour&&tourTick());
document.addEventListener('click',e=>{const b=e.target.closest('[data-tour]');if(!b)return;e.preventDefault();startTour(b.dataset.tour);});
/* first visit: offer the tour, without getting in the way */
setTimeout(()=>{let seen=false;try{seen=localStorage.getItem('trace-toured')==='1';}catch(_){seen=true;}
  if(seen||tour||document.body.classList.contains('viewer')||!$('#present').hidden||/[?&](demo|view)=/.test(location.search)||/^\/v\//.test(location.pathname))return;
  tourBuild();tour={name:'welcome',i:0,steps:[{title:'Welcome to Tracé',body:'Want a 2-minute tour? You make your first animated slide yourself, step by step.<div class="tour-more"><button class="btn primary" data-tour="first">Take the tour</button><button class="btn" data-tour="screen">Just show me around</button></div>',place:'corner',dim:false,next:'Not now',plain:true}]};
  try{localStorage.setItem('trace-toured','1');}catch(_){}tourShow(0);tourTimer=setInterval(tourTick,150);},1600);



/* ---------- keyboard ---------- */
document.addEventListener('keydown',e=>{
  if(!$('#present').hidden){if(e.target&&e.target.closest&&e.target.closest('#plive')&&e.key!=='Escape')return;if(e.key==='c'||e.key==='C'){toggleLive();return;}if(['ArrowRight',' ','PageDown','Enter'].includes(e.key)){e.preventDefault();presNext();}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();presPrev();}else if(e.key==='Escape')closePresent();return;}
  if(!$('#modal').hidden){if(e.key==='Escape')$('#modal').hidden=true;return;}
  const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||'');
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!typing){e.preventDefault();e.shiftKey?redo():undo();return;}
  if(typing)return;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='d'){e.preventDefault();dupObj();return;}
  if((e.key==='Delete'||e.key==='Backspace')&&sel){e.preventDefault();delObj();return;}
  if(e.key==='Escape'&&sel){sel=null;renderCanvas();renderProps();return;}
  const o=sel&&obj(sel);const st=e.shiftKey?0.5:0.1;const mv={ArrowLeft:[-st,0],ArrowRight:[st,0],ArrowUp:[0,st],ArrowDown:[0,-st]}[e.key];
  if(o&&mv){e.preventDefault();snap();const lv=liveOf(o),w=writeOf(o);w.x=+(lv.x+mv[0]).toFixed(3);w.y=+(lv.y+mv[1]).toFixed(3);renderCanvas();thumbsSoon();persist();setField('x',w.x);setField('y',w.y);}});

syncAll&&0;window.onMJ=()=>{texCache.clear();renderEpoch++;renderCanvas();renderThumbs();};
load();refresh();updateProjectUI();
idb.all().then(list=>{if(!list.length)return;list.forEach(([k,v])=>IMG.set(k,v));renderEpoch++;renderCanvas();renderThumbs();renderProps();});
if(window.mjReady)window.onMJ();
